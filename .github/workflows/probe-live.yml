name: Probe live APIs

# 手動診斷:開發沙盒封鎖 *.gov.hk,要查真實 API(某條線存唔存在、ETA 通唔通)就喺呢度跑。
# Actions → Probe live APIs → Run workflow,routes 欄填要查嘅路線號(空格分隔);
# 剔 tiles 會順便檢查地圖底圖(地政總署 / CARTO / OSM)通唔通;剔 ntfy 會檢查手機推送服務。
on:
  workflow_dispatch:
    inputs:
      routes:
        description: '要查嘅路線號,空格分隔(例:38 42C 1A)'
        required: false
        default: '38 42C'
      tiles:
        description: '檢查地圖底圖(印埋旺角圖塊 base64)'
        type: boolean
        default: false
      ntfy:
        description: '檢查 ntfy.sh 推送(CORS / 排程 / 取消)'
        type: boolean
        default: false
      forecast:
        description: '檢查天文台九天預報欄位'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/probe-live.mjs ${{ inputs.routes }}
      - if: ${{ inputs.tiles }}
        run: node scripts/probe-tiles.mjs --dump
      - if: ${{ inputs.ntfy }}
        run: node scripts/probe-ntfy.mjs
      - if: ${{ inputs.forecast }}
        run: node scripts/probe-forecast.mjs
