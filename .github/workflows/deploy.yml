name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/hk-bus-eta-web-g7yxbq]
  workflow_dispatch:
  # 每 3 小時重新部署,保持新聞/路況幾何新鮮(HK 06/09/12/15/18/21 時)
  schedule:
    - cron: '0 22,1,4,7,10,13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 預先抓取路線幾何到 public/geom(same-origin);失敗不致命
      - name: Bake route geometry
        run: node scripts/fetch-geometry.mjs
        continue-on-error: true

      # 預先抓取交通速度圖 link 幾何到 public/tsm;失敗不致命(前端自動隱藏路況圖)
      - name: Bake TSM traffic links
        run: node scripts/fetch-tsm.mjs
        continue-on-error: true

      # 24/7 Fitness 分店(OpenStreetMap);失敗不致命
      - name: Bake fitness locations
        run: node scripts/fetch-fitness.mjs
        continue-on-error: true

      # 香港新聞標題(RTHK RSS,配合 cron 每 3 小時更新);失敗不致命
      - name: Bake news headlines
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - run: npm run build

      # 自動啟用 Pages(若尚未啟用)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages 後端間中「Deployment failed, try again later」—— 等 90 秒重試一次
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
